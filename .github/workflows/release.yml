name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: docs/ssp/vectors/generator/requirements.lock
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.10"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Verify exact release source
        run: make verify
      - name: Verify exact release source with PostgreSQL and race detector
        env:
          SNAGLINE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go test -race -count=1 ./...
          go test -race -count=1 -tags=integration ./...
      - name: Build exact final archives without publishing
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --skip=publish --skip=announce
      - name: Smoke exact final archives
        run: |
          set -eu
          edge_archive="$(find dist -maxdepth 1 -type f -name 'snagline_edge_*_linux_amd64.tar.gz' -print -quit)"
          portable_archive="$(find dist -maxdepth 1 -type f -name 'snagline_*_linux_amd64.tar.gz' ! -name 'snagline_edge_*' -print -quit)"
          test -n "$edge_archive"
          test -n "$portable_archive"
          (cd dist && sha256sum -c checksums.txt)
          tar -tzf "$edge_archive" | grep -qx 'snagline-edge'
          tar -tzf "$edge_archive" | grep -qx 'snagline-dispatcher'
          tar -tzf "$portable_archive" | grep -qx 'snagline-control'
          tar -tzf "$portable_archive" | grep -qx 'snagline-delivery'
          tar -tzf "$portable_archive" | grep -qx 'snagline-front'
          tar -tzf "$portable_archive" | grep -qx 'snagline-buzz-projector'
          tar -tzf "$portable_archive" | grep -qx 'snagline-ssp-verify'
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/edge" "$scratch/portable"
          tar -xzf "$edge_archive" -C "$scratch/edge"
          tar -xzf "$portable_archive" -C "$scratch/portable"
          for binary in \
            "$scratch/edge/snagline-edge" \
            "$scratch/edge/snagline-dispatcher" \
            "$scratch/portable/snagline-control" \
            "$scratch/portable/snagline-delivery" \
            "$scratch/portable/snagline-front" \
            "$scratch/portable/snagline-buzz-projector" \
            "$scratch/portable/snagline-ssp-verify"; do
            set +e
            output="$(timeout 5 "$binary" --help 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 126 ] || [ "$status" -eq 127 ] ||
              printf '%s' "$output" | grep -q 'error while loading shared libraries'; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
      - name: Build, run, and package exact container images
        run: |
          set -eu
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir release-images
          for target in control delivery edge dispatcher buzz-projector ssp-verify; do
            image="snagline-${target}:${{ github.ref_name }}"
            docker build \
              --target "$target" \
              --platform linux/amd64 \
              --build-arg VERSION="${{ github.ref_name }}" \
              --build-arg COMMIT="${{ github.sha }}" \
              --build-arg DATE="$created" \
              --tag "$image" .
            set +e
            output="$(timeout 5 docker run --rm "$image" 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 126 ] || [ "$status" -eq 127 ] ||
              printf '%s' "$output" | grep -q 'error while loading shared libraries'; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            docker save \
              --output "release-images/snagline-${target}_${{ github.ref_name }}_linux_amd64.docker.tar" \
              "$image"
          done
      - name: Create hidden release candidate with exact assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          {
            find dist -maxdepth 1 -type f -name '*.tar.gz'
            find release-images -maxdepth 1 -type f -name '*.docker.tar'
          } | sort | while IFS= read -r asset; do
            digest="$(sha256sum "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$(basename "$asset")"
          done > release-assets.sha256
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "${{ github.ref_name }}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            release-images/*.docker.tar \
            release-assets.sha256
          {
            find dist -maxdepth 1 -type f -name '*.tar.gz' -exec basename {} \;
            find release-images -maxdepth 1 -type f -name '*.docker.tar' -exec basename {} \;
            printf '%s\n' checksums.txt release-assets.sha256
          } | sort > expected-assets.txt
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' |
            sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
      - name: Attest release checksums
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-checksums: ./release-assets.sha256
      - name: Publish complete release atomically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
