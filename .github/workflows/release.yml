name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ needs.prepare.outputs.release_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - name: Resolve release metadata
        id: prepare
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail

          commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${commit_subject#chore(release): }"
          tag="${tag%% \(#*}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]] || {
            echo "::error::Release identifiers must use vX.Y.Z style tags. Got: ${tag}"
            exit 1
          }
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  validate-and-release:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}
      # The v* tag ruleset lets only the release App create tags. Until the
      # App is configured (vars.RELEASE_APP_CLIENT_ID), the job token is used.
      - name: Mint release App token
        id: release-app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create release tag after validation
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          GH_TOKEN: ${{ steps.release-app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$RELEASE_SHA" >/dev/null
          # Later tag-validating steps (gh release create --verify-tag) need
          # the local tag present.
          git fetch --force --tags origin
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/ssp/vectors/generator/requirements.lock
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Install pinned ShellCheck
        run: |
          ./scripts/install-shellcheck.sh "$RUNNER_TEMP/bin/shellcheck"
          echo "SHELLCHECK=$RUNNER_TEMP/bin/shellcheck" >> "$GITHUB_ENV"
      - name: Verify exact release source
        run: make verify
      - name: Verify exact release source with PostgreSQL and race detector
        env:
          SNAGLINE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go test -race -count=1 ./...
          go test -race -count=1 -tags=integration ./...
      - name: Build exact final archives without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --skip=publish --skip=announce
      - name: Smoke exact final archives
        run: |
          set -eu
          edge_archive="$(find dist -maxdepth 1 -type f -name 'snagline_edge_*_linux_amd64.tar.gz' -print -quit)"
          portable_archive="$(find dist -maxdepth 1 -type f -name 'snagline_*_linux_amd64.tar.gz' ! -name 'snagline_edge_*' -print -quit)"
          test -n "$edge_archive"
          test -n "$portable_archive"
          (cd dist && sha256sum -c checksums.txt)
          tar -tzf "$edge_archive" | grep -qx 'snagline-edge'
          tar -tzf "$edge_archive" | grep -qx 'snagline-dispatcher'
          tar -tzf "$edge_archive" | grep -qx 'snagline-dispatcher-runtime'
          tar -tzf "$edge_archive" | grep -qx 'snagline-dispatcher-proxy'
          tar -tzf "$portable_archive" | grep -qx 'snagline-control'
          tar -tzf "$portable_archive" | grep -qx 'snagline-delivery'
          tar -tzf "$portable_archive" | grep -qx 'snagline-front'
          tar -tzf "$portable_archive" | grep -qx 'snagline-case'
          tar -tzf "$portable_archive" | grep -qx 'snagline-buzz-projector'
          tar -tzf "$portable_archive" | grep -qx 'snagline-ssp-verify'
          for archive in "$edge_archive" "$portable_archive"; do
            tar -tzf "$archive" | grep -qx 'LICENSE'
            tar -tzf "$archive" | grep -qx 'README.md'
            tar -tzf "$archive" | grep -qx 'THIRD_PARTY_NOTICES.md'
            tar -tzf "$archive" | grep -qx 'LICENSES/Apache-2.0.txt'
          done
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/edge" "$scratch/portable"
          tar -xzf "$edge_archive" -C "$scratch/edge"
          tar -xzf "$portable_archive" -C "$scratch/portable"
          for binary in \
            "$scratch/edge/snagline-edge" \
            "$scratch/edge/snagline-dispatcher" \
            "$scratch/edge/snagline-dispatcher-runtime" \
            "$scratch/edge/snagline-dispatcher-proxy" \
            "$scratch/portable/snagline-control" \
            "$scratch/portable/snagline-delivery" \
            "$scratch/portable/snagline-front" \
            "$scratch/portable/snagline-case" \
            "$scratch/portable/snagline-buzz-projector" \
            "$scratch/portable/snagline-ssp-verify"; do
            set +e
            output="$(timeout 5 "$binary" --help 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 126 ] || [ "$status" -eq 127 ] ||
              printf '%s' "$output" | grep -q 'error while loading shared libraries'; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
      - name: Build, run, and package exact container images
        run: |
          set -eu
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir release-images
          for target in control delivery edge case dispatcher dispatcher-runtime buzz-projector ssp-verify; do
            image="snagline-${target}:${{ needs.prepare.outputs.tag }}"
            docker build \
              --target "$target" \
              --platform linux/amd64 \
              --build-arg VERSION="${{ needs.prepare.outputs.tag }}" \
              --build-arg COMMIT="${{ needs.prepare.outputs.release_sha }}" \
              --build-arg DATE="$created" \
              --tag "$image" .
            set +e
            output="$(timeout 5 docker run --rm "$image" 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 126 ] || [ "$status" -eq 127 ] ||
              printf '%s' "$output" | grep -q 'error while loading shared libraries'; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            docker save \
              --output "release-images/snagline-${target}_${{ needs.prepare.outputs.tag }}_linux_amd64.docker.tar" \
              "$image"
          done
      - name: Create hidden release candidate with exact assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "${{ needs.prepare.outputs.tag }}" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          {
            find dist -maxdepth 1 -type f -name '*.tar.gz'
            find release-images -maxdepth 1 -type f -name '*.docker.tar'
          } | sort | while IFS= read -r asset; do
            digest="$(sha256sum "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$(basename "$asset")"
          done > release-assets.sha256
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "${{ needs.prepare.outputs.tag }}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            release-images/*.docker.tar \
            release-assets.sha256
          {
            find dist -maxdepth 1 -type f -name '*.tar.gz' -exec basename {} \;
            find release-images -maxdepth 1 -type f -name '*.docker.tar' -exec basename {} \;
            printf '%s\n' checksums.txt release-assets.sha256
          } | sort > expected-assets.txt
          gh release view "${{ needs.prepare.outputs.tag }}" --json assets --jq '.assets[].name' |
            sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
      - name: Attest release checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./release-assets.sha256
      - name: Publish complete release atomically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
