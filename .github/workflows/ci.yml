name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: docs/ssp/vectors/generator/requirements.lock
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.10"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Install SQLCipher build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Check formatting
        run: make fmt-check
      - name: Verify CGO-disabled edge fails before filesystem access
        run: make verify-sqlcipher-build
      - name: Test
        run: make test
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Integration race test
        env:
          SNAGLINE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 -tags=integration ./...
      - name: Vet
        run: make vet
      - name: Build commands
        run: make build
      - name: Verify SSP vectors
        run: make verify-ssp
      - name: Verify stock Buzz deployment contract
        run: make verify-buzz-contract
      - name: Secrets scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          make secrets-scan
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: check
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean
      - name: Smoke release archives
        run: |
          set -eu
          edge_archive="$(find dist -maxdepth 1 -type f -name 'snagline_edge_*_linux_amd64.tar.gz' -print -quit)"
          portable_archive="$(find dist -maxdepth 1 -type f -name 'snagline_*_linux_amd64.tar.gz' ! -name 'snagline_edge_*' -print -quit)"
          test -n "$edge_archive"
          test -n "$portable_archive"
          (cd dist && sha256sum -c checksums.txt)
          tar -tzf "$edge_archive" | grep -qx 'snagline-edge'
          tar -tzf "$edge_archive" | grep -qx 'snagline-dispatcher'
          tar -tzf "$portable_archive" | grep -qx 'snagline-control'
          tar -tzf "$portable_archive" | grep -qx 'snagline-delivery'
          tar -tzf "$portable_archive" | grep -qx 'snagline-front'
          tar -tzf "$portable_archive" | grep -qx 'snagline-buzz-projector'
          tar -tzf "$portable_archive" | grep -qx 'snagline-ssp-verify'
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/edge" "$scratch/portable"
          tar -xzf "$edge_archive" -C "$scratch/edge"
          tar -xzf "$portable_archive" -C "$scratch/portable"
          for binary in \
            "$scratch/edge/snagline-edge" \
            "$scratch/edge/snagline-dispatcher" \
            "$scratch/portable/snagline-control" \
            "$scratch/portable/snagline-delivery" \
            "$scratch/portable/snagline-front" \
            "$scratch/portable/snagline-buzz-projector" \
            "$scratch/portable/snagline-ssp-verify"; do
            set +e
            output="$(timeout 5 "$binary" --help 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 126 ] || [ "$status" -eq 127 ] ||
              printf '%s' "$output" | grep -q 'error while loading shared libraries'; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
      - name: Build and load every container target
        run: |
          set -eu
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for target in control delivery edge dispatcher buzz-projector ssp-verify; do
            image="snagline-${target}:ci"
            docker build \
              --target "$target" \
              --build-arg VERSION=ci \
              --build-arg COMMIT="${{ github.sha }}" \
              --build-arg DATE="$created" \
              -t "$image" .
            set +e
            output="$(docker run --rm "$image" 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 126 ] || [ "$status" -eq 127 ] ||
              printf '%s' "$output" | grep -q 'error while loading shared libraries'; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
